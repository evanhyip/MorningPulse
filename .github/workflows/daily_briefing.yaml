name: ☀️ MorningPulse Daily Dispatch

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MorningPulse Dispatch
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_TOKEN: ${{ secrets.SNOWFLAKE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_SENDER_EMAIL: ${{ secrets.BRIEFING_SENDER_EMAIL }}
          BRIEFING_RECIPIENT_EMAILS: ${{ secrets.BRIEFING_RECIPIENT_EMAILS }}
        run: |
          python -m scripts.dispatch_morning_pulse